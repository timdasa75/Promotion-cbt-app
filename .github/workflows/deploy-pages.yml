name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployed Worker routes and payment secrets (frontend/backend drift)
        env:
          WORKER_BASE_URL: ${{ secrets.CLOUDFLARE_AUTH_BASE_URL }}
          # When a wrangler-scoped token exists, the route check also verifies
          # the payment-provider secrets (FLW_SECRET_KEY, FLW_WEBHOOK_SECRET_HASH)
          # are deployed, so a silently unkeyed Flutterwave auto-grant path
          # fails CI; without the token the secret checks are skipped, so CI
          # stays green.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${WORKER_BASE_URL}" ]; then
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
              npm run check:worker-routes -- --check-flutterwave-key
            else
              npm run check:worker-routes
            fi
          else
            echo "CLOUDFLARE_AUTH_BASE_URL secret not set; skipping Worker route check."
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate auth configuration (Firebase & Cloudflare)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CLOUDFLARE_AUTH_BASE_URL: ${{ secrets.CLOUDFLARE_AUTH_BASE_URL }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "${CLOUDFLARE_AUTH_BASE_URL}" ]; then
            echo "CLOUDFLARE_AUTH_BASE_URL is required for the production Cloudflare auth mode."
            exit 1
          fi

      - name: Generate runtime auth config from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADMIN_API_BASE_URL: ${{ secrets.ADMIN_API_BASE_URL }}
          CLOUDFLARE_AUTH_BASE_URL: ${{ secrets.CLOUDFLARE_AUTH_BASE_URL }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          cat > config/runtime-auth.js <<EOF
          // Generated during GitHub Pages deploy. Do not commit live values.
          // Guarded so test runners and tools can inject an override config
          // before this module loads (same pattern as the local template).
          window.PROMOTION_CBT_AUTH = window.PROMOTION_CBT_AUTH || {
            // Cloudflare auth is primary — all login/register/session flows go
            // through the Worker so Firebase keys are never exposed to the client.
            authProvider: "cloudflare",
            // Minimal Firebase stubs kept only for Firestore document reads.
            firebaseApiKey: "${FIREBASE_API_KEY}",
            firebaseProjectId: "${FIREBASE_PROJECT_ID}",
            firebaseAuthDomain: "${FIREBASE_AUTH_DOMAIN}",
            googleClientId: "${GOOGLE_CLIENT_ID}",
            cloudflareAuthBaseUrl: "${CLOUDFLARE_AUTH_BASE_URL}",
            enableCloudProgressSync: true,
            adminApiBaseUrl: "${ADMIN_API_BASE_URL}",
            // Production has one authentication authority. Existing Firebase
            // accounts migrate through the explicit support flow instead.
            allowFirebaseFallback: false,
            adminDirectorySyncIntervalMs: 60000,
            verificationResendCooldownMs: 900000,
            passwordResetCooldownMs: 600000,
            paymentProvider: "${PAYMENT_PROVIDER:-flutterwave}",
            flutterwavePublicKey: "${FLUTTERWAVE_PUBLIC_KEY}",
            flutterwaveWebhookUrl: "${CLOUDFLARE_AUTH_BASE_URL}/payment/webhook/flutterwave",
            adminEmails: "${ADMIN_EMAILS}".split(",").map((email) => email.trim()).filter(Boolean),
          };
          EOF

      # The Pages checkout intentionally excludes private question-bank files.
      # Run checks that remain deterministic without protected content; the full
      # smoke suite continues to run from an environment with those assets.
      - name: Verify Pages release (metadata, unit tests, and build)
        run: npm run verify:pages

      # WCAG colour contract: fail the release when a required foreground /
      # background token pair drops below 4.5:1 (3:1 for UI boundaries) in
      # either theme.
      - name: Colour contrast audit (WCAG pairs)
        run: npm run test:colour

      # Stage 6 responsive matrix: fail on horizontal overflow or clipped
      # visible controls at the 375/768/1280/1920 viewports. The spec soft-skips
      # the topic category/setup steps when private question banks are absent
      # from this checkout, so the gate stays deterministic.
      - name: Responsive layout matrix (overflow and clipping)
        run: npm run test:responsive

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
