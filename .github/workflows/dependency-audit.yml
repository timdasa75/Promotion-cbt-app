name: Dependency audit

# Keeps the vulnerability backlog from rebuilding. Every push/PR audits BOTH npm
# manifests in the repo — the root tooling manifest and the Firebase Cloud
# Functions fallback — because each is a separate lockfile the dependency graph
# scans, and auditing only the root is how the functions backlog grew unseen.
# The weekly scheduled run doubles as a digest: severity counts land in the run
# summary, and the run goes red while any critical/high advisory is in either
# tree.
#
# Note: this cannot use the Dependabot alerts REST API. GITHUB_TOKEN is never
# granted access to it (it needs a PAT with `security_events`), so the digest
# reports what npm resolves for these lockfiles and links to the alert page for
# the wider view.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays 06:10 Africa/Lagos (05:10 UTC), shortly after Dependabot's run.
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - "."
          - "functions"
    defaults:
      run:
        working-directory: ${{ matrix.manifest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.manifest }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve advisories as JSON
        run: npm audit --json > audit.json || true

      # Gate plus digest in one step: fail on any critical/high advisory in this
      # manifest (both are devDependency-heavy, but a compromised build tool or
      # a vulnerable transitive in the functions runtime is still a supply-chain
      # risk, so neither tree is exempt), while writing the severity counts into
      # the run summary so a scheduled run is readable without opening the
      # alerts page.
      - name: Summarize and gate on critical or high advisories
        env:
          REPO: ${{ github.repository }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          node -e '
          const fs = require("fs");
          let data = {};
          try { data = JSON.parse(fs.readFileSync("audit.json", "utf8")); } catch (e) {}
          const vulns = data.vulnerabilities || {};
          const m = (data.metadata && data.metadata.vulnerabilities) || {};
          const c = m.critical || 0, h = m.high || 0, mo = m.moderate || 0, lo = m.low || 0, t = m.total || 0;
          const repo = process.env.REPO;
          const manifest = process.env.MANIFEST;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Dependency audit digest - ${manifest}`,
            "",
            `- Advisories in this tree: **${t}** (critical: ${c}, high: ${h}, moderate: ${mo}, low: ${lo})`,
            `- GitHub alert queue: https://github.com/${repo}/security/dependabot`,
            "- Policy: fix or dismiss every critical/high; the grouped weekly Dependabot PRs handle the rest.",
            "- Scope: advisories the npm registry reports for this lockfile. The GitHub alert page also covers other ecosystems and unpatched ranges.",
            "",
          ].join("\n"));
          for (const [name, info] of Object.entries(vulns)) {
            if (info.severity !== "critical" && info.severity !== "high") continue;
            const titles = (info.via || []).map((v) => (typeof v === "string" ? v : v.title)).filter(Boolean).join("; ");
            console.log(`::error::${manifest} - ${name} (${info.severity}) - ${titles}`);
          }
          if (c > 0 || h > 0) {
            console.log(`::error::${manifest} has ${c} critical and ${h} high advisories. Run npm audit fix in that directory and re-push.`);
            process.exit(1);
          }
          console.log(`Audit clean at critical/high for ${manifest}: ${t} advisories in the tree (moderate ${mo}, low ${lo}).`);
          '

  # Label Dependabot's PRs "dependencies" so they group in the PR list. Separate
  # job so it runs once regardless of the audit matrix, and non-fatal: PRs
  # opened by Dependabot can run with a read-only token, and a cosmetic label
  # must never redden a passing audit.
  label:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Add the dependencies label
        run: gh pr edit "$PR_URL" --add-label dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
