name = "promotion-cbt-admin-bridge"
main = "worker.js"
compatibility_date = "2026-03-08"
workers_dev = true
preview_urls = false

# Configure your own route/domain in Cloudflare dashboard.

[vars]
FIREBASE_PROJECT_ID = "promotioncbt-app"
ALLOWED_ORIGINS = "https://timdasa75.github.io,http://127.0.0.1:5500,http://localhost:5500,http://[::1]:5500"
APP_BASE_URL = "https://timdasa75.github.io/Promotion-cbt-app"
ADMIN_EMAILS = "timdasa75@gmail.com"
SYNC_AUTH_DISABLED = "true"
GOOGLE_CLIENT_ID = "189179429434-9bktce89mgnj0nikgmdd0e5gjvteegnd.apps.googleusercontent.com"
# Optional quota billing project for x-goog-user-project header (omit unless needed).
# FIREBASE_QUOTA_PROJECT_ID = "promotioncbt-app"

[assets]
directory = "../../data"
binding = "PROTECTED_CONTENT"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Hybrid auth D1 binding (enable after creating the database and granting D1 token permissions):
[[d1_databases]]
binding = "AUTH_DB"
database_name = "promotion-cbt-auth"
database_id = "a4216d4f-2974-44c8-99f0-db5eb43ec6f0"

# Secrets required (set via `wrangler secret put`):
# - FIREBASE_API_KEY
# - GCP_SERVICE_ACCOUNT_EMAIL
# - GCP_SERVICE_ACCOUNT_PRIVATE_KEY
# - SELAR_WEBHOOK_SECRET (shared secret for the Zapier bridge: Selar "New Sale"
#   pushes to /payment/webhook/selar with x-selar-signature = this secret;
#   unset = the route answers 503 and automation silently stops)
# - SELAR_API_KEY (legacy Selar merchant API key for /payment/selar/verify;
#   the polling endpoint does not exist — kept for the degraded path only)
# - SELAR_API_BASE_URL (optional, defaults to https://api.selar.co/v2)
# - RESEND_API_KEY (optional, for sending verification/password reset emails)
#   Sign up at https://resend.com for free tier (100 emails/day)
