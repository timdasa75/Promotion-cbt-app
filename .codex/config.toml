# Project-local Codex reference config for Promotion CBT App.
# This is intentionally lean: ECC is integrated through AGENTS.md and selected skills
# without enabling network-heavy MCP servers by default.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

persistent_instructions = "Follow the root AGENTS.md and .codex/AGENTS.md. Explain relevant codebase structure as you work."

[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist for APIs, platform behavior, and release notes."
config_file = "agents/docs-researcher.toml"
